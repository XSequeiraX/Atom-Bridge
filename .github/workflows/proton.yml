name: Proton

# O Proton (proton/) e o companion de Windows e Mac: C#/.NET. Testa-se nos tres sistemas (o que importa e o que corre a sério em cada
# um: caminhos, datas, copia) e gera o programa autonomo para Windows (x64) e Mac (Apple Silicon e Intel).
on:
  push:
    paths:
      - "proton/**"
      - "atom/app/takes_export.py"
      - ".github/workflows/proton.yml"
  pull_request:
    paths:
      - "proton/**"
      - "atom/app/takes_export.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
      - name: .NET (o dos servidores do GitHub)
        run: dotnet --version
      - name: Testes do Proton
        working-directory: proton
        env:
          DOTNET_ROLL_FORWARD: Major        # se o servidor so tiver um .NET mais novo, os testes (net8.0) correm nele
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: dotnet test Proton.sln -c Release

  programas:
    needs: testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
      - name: Gerar os programas (janela e linha de comandos; Windows x64, Mac Apple Silicon e Intel)
        working-directory: proton
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          set -e
          mkdir -p ../dist
          for rid in win-x64 osx-arm64 osx-x64; do
            dotnet publish src/Proton.Cli -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "../dist/proton-cli-$rid"
            dotnet publish src/Proton.App -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "/tmp/app-$rid"
            rm -f "../dist/proton-cli-$rid"/*.pdb "/tmp/app-$rid"/*.pdb
          done
          cp -r /tmp/app-win-x64 ../dist/Proton-windows-x64
          for rid in osx-arm64 osx-x64; do
            packaging/make-mac-app.sh "/tmp/app-$rid" "/tmp/mac-$rid" 0.0.1
            (cd "/tmp/mac-$rid" && zip -qry "$GITHUB_WORKSPACE/dist/Proton-mac-$rid.zip" Proton.app)
          done
          ls -la ../dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02      # v4
        with:
          name: proton
          path: dist/
          retention-days: 30
